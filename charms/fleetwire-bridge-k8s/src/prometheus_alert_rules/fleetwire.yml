# Generated by charms/cos_files.py from deploy/prometheus/rules/fleetwire.yml:
# the rules on fleetwire-bridge's metrics and the liveness rules.
# Edit the source and run the script; do not edit this copy.
groups:
- name: fleetwire-symptoms
  rules:
  - alert: FleetwireBridgeNotProducing
    expr: (time() - fleetwire_bridge_last_produce_timestamp_seconds) > 120 and fleetwire_bridge_pending_acks > 0
    for: 2m
    labels:
      severity: page
    annotations:
      summary: '{{ $labels.instance }}: messages wait for Kafka and no write has been confirmed for over 2 minutes.'
- name: fleetwire-liveness
  rules:
  - alert: FleetwireTargetDown
    expr: up{job=~"fleetwire-(api|bridge|ingest)"} == 0
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}.
  - alert: FleetwireServiceDown
    expr: sum by (job) (up{job=~"fleetwire-(api|bridge|ingest)"}) == 0 or absent(up{job="fleetwire-bridge"})
    for: 2m
    labels:
      severity: page
    annotations:
      summary: No {{ $labels.job }} target is up or none is configured; the alerts that depend on its metrics cannot fire.
