[tox]
env_list = lint, unit
no_package = true

[vars]
src = {tox_root}/src
tests = {tox_root}/tests
lib = {tox_root}/lib

[testenv]
set_env =
    PYTHONPATH = {tox_root}:{[vars]lib}:{[vars]src}
    PY_COLORS = 1

[testenv:lint]
description = Check style and common bugs with ruff
deps =
    ruff==0.17.4
commands =
    ruff check {[vars]src} {[vars]tests}
    ruff format --check --diff {[vars]src} {[vars]tests}

[testenv:unit]
description = State-transition unit tests with ops.testing
deps =
    -r {tox_root}/requirements.txt
    ops[testing]==3.9.0
    pytest==9.2.0
commands =
    pytest -q {posargs} {[vars]tests}/unit
