# Generated by charms/cos_files.py from deploy/prometheus/rules/fleetwire.yml:
# the rules on fleetwire-api's metrics and the liveness rules.
# Edit the source and run the script; do not edit this copy.
groups:
- name: fleetwire-sli
  rules:
  - record: fleetwire:api_errors:ratio_rate5m
    expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[5m])) or vector(0)) / sum(rate(fleetwire_api_requests_total[5m]))
  - record: fleetwire:api_errors:ratio_rate30m
    expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[30m])) or vector(0)) / sum(rate(fleetwire_api_requests_total[30m]))
  - record: fleetwire:api_errors:ratio_rate1h
    expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[1h])) or vector(0)) / sum(rate(fleetwire_api_requests_total[1h]))
  - record: fleetwire:api_errors:ratio_rate6h
    expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[6h])) or vector(0)) / sum(rate(fleetwire_api_requests_total[6h]))
- name: fleetwire-slo-alerts
  rules:
  - alert: FleetwireAPIBudgetBurnFast
    expr: fleetwire:api_errors:ratio_rate1h > (14.4 * 0.001) and fleetwire:api_errors:ratio_rate5m > (14.4 * 0.001)
    labels:
      severity: page
      slo: availability
    annotations:
      summary: The API answers with 5xx; the availability budget burns 14.4x too fast.
  - alert: FleetwireAPIBudgetBurnSlow
    expr: fleetwire:api_errors:ratio_rate6h > (6 * 0.001) and fleetwire:api_errors:ratio_rate30m > (6 * 0.001)
    labels:
      severity: ticket
      slo: availability
    annotations:
      summary: The API answers with 5xx at a rate that will exhaust the budget.
- name: fleetwire-symptoms
  rules:
  - alert: FleetwireCRLStale
    expr: |-
      min(fleetwire_crl_age_seconds < 1e9) > 48 * 3600 or (
        min((time() - process_start_time_seconds) and (fleetwire_crl_age_seconds >= 1e9)) > 48 * 3600
        unless on () (fleetwire_crl_age_seconds < 1e9)
      )
    for: 5m
    labels:
      severity: page
    annotations:
      summary: No API replica has published the device CRL for 48 h; the broker will reject all devices when it expires.
  - alert: FleetwireCRLNotPublished
    expr: fleetwire_crl_age_seconds >= 1e9
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: '{{ $labels.instance }} has not published the device CRL since it started; its log has the publisher''s error.'
- name: fleetwire-liveness
  rules:
  - alert: FleetwireTargetDown
    expr: up{job=~"fleetwire-(api|bridge|ingest)"} == 0
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}.
  - alert: FleetwireServiceDown
    expr: sum by (job) (up{job=~"fleetwire-(api|bridge|ingest)"}) == 0 or absent(up{job="fleetwire-api"})
    for: 2m
    labels:
      severity: page
    annotations:
      summary: No {{ $labels.job }} target is up or none is configured; the alerts that depend on its metrics cannot fire.
