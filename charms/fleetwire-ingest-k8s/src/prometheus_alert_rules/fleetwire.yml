# Generated by charms/cos_files.py from deploy/prometheus/rules/fleetwire.yml:
# the rules on fleetwire-ingest's metrics and the liveness rules.
# Edit the source and run the script; do not edit this copy.
groups:
- name: fleetwire-sli
  rules:
  - record: fleetwire:freshness_errors:ratio_rate5m
    expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[5m])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[5m])))
  - record: fleetwire:freshness_errors:ratio_rate30m
    expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[30m])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[30m])))
  - record: fleetwire:freshness_errors:ratio_rate1h
    expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[1h])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[1h])))
  - record: fleetwire:freshness_errors:ratio_rate6h
    expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[6h])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[6h])))
  - record: fleetwire:dlq_errors:ratio_rate5m
    expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[5m])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[5m]))
  - record: fleetwire:dlq_errors:ratio_rate30m
    expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[30m])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[30m]))
  - record: fleetwire:dlq_errors:ratio_rate1h
    expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[1h])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[1h]))
  - record: fleetwire:dlq_errors:ratio_rate6h
    expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[6h])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[6h]))
- name: fleetwire-slo-alerts
  rules:
  - alert: FleetwireFreshnessBudgetBurnFast
    expr: fleetwire:freshness_errors:ratio_rate1h > (14.4 * 0.01) and fleetwire:freshness_errors:ratio_rate5m > (14.4 * 0.01)
    labels:
      severity: page
      slo: freshness
    annotations:
      summary: Readings are reaching storage too late; the 30-day freshness budget burns 14.4x too fast.
      runbook: docs/how-to/run-failure-tests.md
  - alert: FleetwireFreshnessBudgetBurnSlow
    expr: fleetwire:freshness_errors:ratio_rate6h > (6 * 0.01) and fleetwire:freshness_errors:ratio_rate30m > (6 * 0.01)
    labels:
      severity: ticket
      slo: freshness
    annotations:
      summary: Readings are reaching storage too late; the freshness budget burns 6x too fast.
  - alert: FleetwireDeadLetterBudgetBurnFast
    expr: fleetwire:dlq_errors:ratio_rate1h > (14.4 * 0.0001) and fleetwire:dlq_errors:ratio_rate5m > (14.4 * 0.0001)
    labels:
      severity: page
      slo: correctness
    annotations:
      summary: Batches are going to the dead-letter topic; check its fw-dlq-reason headers.
  - alert: FleetwireDeadLetterBudgetBurnSlow
    expr: fleetwire:dlq_errors:ratio_rate6h > (6 * 0.0001) and fleetwire:dlq_errors:ratio_rate30m > (6 * 0.0001)
    labels:
      severity: ticket
      slo: correctness
    annotations:
      summary: Batches are going to the dead-letter topic at a rate that will exhaust the budget.
- name: fleetwire-symptoms
  rules:
  - alert: FleetwireConsumerLagGrowing
    expr: sum(fleetwire_ingest_consumer_lag) > 1000 and deriv(sum(fleetwire_ingest_consumer_lag)[10m:1m]) > 0
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: Ingest falls further behind Kafka; it is slower than the incoming rate.
  - alert: FleetwireExclusionViolation
    expr: increase(fleetwire_ingest_exclusion_violations_total[10m]) > 0
    labels:
      severity: page
    annotations:
      summary: The database rejected an overlapping chunk. This is a bug signal; the batch went to the DLQ and the device will resend.
- name: fleetwire-liveness
  rules:
  - alert: FleetwireTargetDown
    expr: up{job=~"fleetwire-(api|bridge|ingest)"} == 0
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}.
  - alert: FleetwireServiceDown
    expr: sum by (job) (up{job=~"fleetwire-(api|bridge|ingest)"}) == 0 or absent(up{job="fleetwire-ingest"})
    for: 2m
    labels:
      severity: page
    annotations:
      summary: No {{ $labels.job }} target is up or none is configured; the alerts that depend on its metrics cannot fire.
