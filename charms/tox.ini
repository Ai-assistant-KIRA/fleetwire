# Bundle-level tests. Each charm has its own tox.ini for lint and unit tests.
[tox]
env_list = lint
no_package = true

[testenv:lint]
description = Check the integration test and cos_files.py with ruff
deps =
    ruff==0.17.4
commands =
    ruff check {tox_root}/tests {tox_root}/cos_files.py
    ruff format --check --diff {tox_root}/tests {tox_root}/cos_files.py

[testenv:integration]
description = Deploy the bundle on MicroK8s and send a real agent's data through it (needs Juju)
deps =
    jubilant==1.14.0
    pytest==9.2.0
    pytest-jubilant==2.3.0
pass_env =
    FLEETWIRE_COS
    FLEETWIRE_IMAGES
    HOME
    PATH
commands =
    pytest -v --tb=short {posargs} {tox_root}/tests/integration
