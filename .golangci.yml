version: "2"

run:
  timeout: 10m
  tests: true

linters:
  # Explicit list: a new golangci-lint release must not change what CI checks.
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    misspell:
      locale: US
      ignore-rules:
        - mosquitto
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        # Copying row structs of a few hundred bytes is cheap next to the
        # database round trip that produced them, and value loops read better.
        - hugeParam
        - rangeValCopy
    gosec:
      excludes:
        # G115 (integer overflow on conversion) fires on every uint64<->int64
        # conversion; the conversions that matter are bounds-checked in code.
        - G115
        # G304 (file path from a variable): every path here comes from
        # operator configuration or is built from server-generated IDs, never
        # from request input. The WAL and keyring could not work without it.
        - G304
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments: [disableStutteringCheck]
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, forcetypeassert, noctx, errcheck, unparam]
      - path: _test\.go
        linters: [revive]
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Ai-assistant-KIRA/fleetwire
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
