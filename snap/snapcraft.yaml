name: fleetwire-agent
base: core24
adopt-info: agent
summary: Reliable telemetry agent for Ubuntu Core fleets
description: |
  Collects system readings (CPU, memory, load, uptime, disk, temperature),
  keeps them in a local write-ahead log in $SNAP_DATA, and sends them over
  MQTT with mutual TLS until the fleetwire backend confirms they are stored.

  Enroll the device:
    snap set fleetwire-agent enroll.url=https://api.example:8444 enroll.token=fwe_...
  For a private CA, also set enroll.ca-bundle="$(cat ca.pem)".
  Temperatures need: snap connect fleetwire-agent:hardware-observe
grade: stable
confinement: strict
license: Apache-2.0
website: https://github.com/Ai-assistant-KIRA/fleetwire

platforms:
  amd64:
  arm64:

# The daemon runs as this system user, uid and gid 584788 on every system,
# instead of root.
system-usernames:
  snap_daemon: shared
apps:
  daemon:
    # snapd starts every daemon as root. The command chain first prepares
    # $SNAP_DATA/state as root (prepare-state), then continues as
    # snap_daemon with no capabilities (drop-privileges); both scripts are
    # in snap/local. The agent keeps its identity and local log in
    # $SNAP_DATA/state because the snap's AppArmor profile does not let
    # even root change the owner of $SNAP_DATA itself.
    command: bin/fleetwire-agent run
    command-chain: [bin/prepare-state, bin/drop-privileges]
    daemon: simple
    restart-condition: always
    restart-delay: 5s
    # network: broker and enrollment API. network-bind: /metrics and
    # /status on 127.0.0.1:9465. hardware-observe: /sys/class/thermal.
    # system-observe is not auto-connected, and the built-in readings do not
    # need it: snapd's default AppArmor profile already allows /proc/stat,
    # meminfo, loadavg and uptime (checked with the plug disconnected on
    # snapd 2.78, which still denied /proc/partitions).
    plugs: [network, network-bind, system-observe, hardware-observe]
  fleetwire-agent:
    # `fleetwire-agent status` asks the daemon over 127.0.0.1. Run with
    # sudo, it also continues as snap_daemon, so it can read the state when
    # the daemon is stopped and never leaves a root-owned file in it.
    command: bin/fleetwire-agent
    command-chain: [bin/drop-privileges]
    plugs: [network]

parts:
  agent:
    plugin: go
    source: .
    build-packages: [git]
    build-snaps: [go/1.27/stable]
    override-pull: |
      set -e -o pipefail
      cd "${CRAFT_PROJECT_DIR}"
      # Test for .git rather than ask git: a checkout that git refuses to
      # read must fail the build, not quietly become version dev.
      if [ -e .git ]; then
        # Copy tracked and non-ignored local sources without generated VM
        # state. A tracked file deleted in the working tree is skipped, so
        # tar does not fail on it.
        git ls-files -z --cached --others --exclude-standard |
          while IFS= read -r -d '' f; do
            if [ -e "$f" ] || [ -L "$f" ]; then printf '%s\0' "$f"; fi
          done |
          tar --no-recursion --null --files-from=- --create --file=- |
          tar -xf - -C "${CRAFT_PART_SRC}"
        # One version and commit for the snap metadata and the binary.
        VERSION="$(git describe --tags --always --dirty)"
        COMMIT="$(git rev-parse HEAD)"
      else
        # Not a git checkout (an unpacked source archive): git cannot list
        # the sources, so copy only what the agent build reads.
        echo "no .git in ${CRAFT_PROJECT_DIR}: building version dev" >&2
        tar --create --file=- go.mod go.sum cmd internal | tar -xf - -C "${CRAFT_PART_SRC}"
        VERSION=dev
        COMMIT=unknown
      fi
      craftctl set version="${VERSION}"
      # The build step reads these, as make build stamps every other binary.
      printf 'COMMIT=%s\nDATE=%s\n' "${COMMIT}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        > "${CRAFT_PART_SRC}/.snap-buildinfo"
    override-build: |
      VERSION="$(craftctl get version)"
      . "${CRAFT_PART_SRC}/.snap-buildinfo"
      PKG=github.com/Ai-assistant-KIRA/fleetwire/internal/buildinfo
      CGO_ENABLED=0 go build -trimpath -buildvcs=false \
        -ldflags "-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Date=${DATE}" \
        -o "${CRAFT_PART_INSTALL}/bin/fleetwire-agent" ./cmd/fleetwire-agent
  command-chain:
    plugin: dump
    source: snap/local
    organize:
      drop-privileges: bin/drop-privileges
      prepare-state: bin/prepare-state
