name: fleetwire-agent
base: core24
adopt-info: agent
summary: Reliable telemetry agent for Ubuntu Core fleets
description: |
  Collects system readings (CPU, memory, load, uptime, disk, temperature),
  keeps them in a local write-ahead log in $SNAP_DATA, and sends them over
  MQTT with mutual TLS until the fleetwire backend confirms they are stored.

  Enroll the device:
    snap set fleetwire-agent enroll.url=https://api.example:8444 enroll.token=fwe_...
  For a private CA, also set enroll.ca-bundle="$(cat ca.pem)".
  Temperatures need: snap connect fleetwire-agent:hardware-observe
grade: stable
confinement: strict
license: Apache-2.0
website: https://github.com/Ai-assistant-KIRA/fleetwire

platforms:
  amd64:
  arm64:

apps:
  daemon:
    command: bin/fleetwire-agent run
    daemon: simple
    restart-condition: always
    restart-delay: 5s
    # network: broker and enrollment API. network-bind: /metrics and
    # /status on 127.0.0.1:9465. system-observe: /proc/stat, meminfo,
    # loadavg, uptime. hardware-observe: /sys/class/thermal.
    plugs: [network, network-bind, system-observe, hardware-observe]
  fleetwire-agent:
    # `fleetwire-agent status` asks the daemon over 127.0.0.1.
    command: bin/fleetwire-agent
    plugs: [network]

parts:
  agent:
    plugin: go
    source: .
    build-packages: [git]
    build-snaps: [go/1.27/stable]
    override-pull: |
      set -e -o pipefail
      cd "${CRAFT_PROJECT_DIR}"
      # Test for .git rather than ask git: a checkout that git refuses to
      # read must fail the build, not quietly become version dev.
      if [ -e .git ]; then
        # Copy tracked and non-ignored local sources without generated VM
        # state. A tracked file deleted in the working tree is skipped, so
        # tar does not fail on it.
        git ls-files -z --cached --others --exclude-standard |
          while IFS= read -r -d '' f; do
            if [ -e "$f" ] || [ -L "$f" ]; then printf '%s\0' "$f"; fi
          done |
          tar --no-recursion --null --files-from=- --create --file=- |
          tar -xf - -C "${CRAFT_PART_SRC}"
        # Resolve the version from the checked-out project, then reuse it
        # for the snap metadata and the binary.
        VERSION="$(git describe --tags --always --dirty)"
      else
        # Not a git checkout (an unpacked source archive): git cannot list
        # the sources, so copy only what the agent build reads.
        echo "no .git in ${CRAFT_PROJECT_DIR}: building version dev" >&2
        tar --create --file=- go.mod go.sum cmd internal | tar -xf - -C "${CRAFT_PART_SRC}"
        VERSION=dev
      fi
      craftctl set version="${VERSION}"
    override-build: |
      VERSION="$(craftctl get version)"
      CGO_ENABLED=0 go build -trimpath -buildvcs=false \
        -ldflags "-s -w -X github.com/Ai-assistant-KIRA/fleetwire/internal/buildinfo.Version=${VERSION}" \
        -o "${CRAFT_PART_INSTALL}/bin/fleetwire-agent" ./cmd/fleetwire-agent
