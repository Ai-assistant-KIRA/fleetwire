# promtool test rules deploy/prometheus/tests/fleetwire_test.yml
rule_files:
  - ../rules/fleetwire.yml
evaluation_interval: 1m

# Bucket bounds are written le="5.0" as Prometheus 3 stores them after a
# scrape, so these tests use the same series the rules see in production.
tests:
  # 20% of readings arrive late for over an hour. The 1 h and 5 m error
  # ratios (0.2) both exceed 14.4 x the 1% budget (0.144): the fast alert
  # pages.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}'
        values: '0+80x90'
      - series: 'fleetwire_ingest_e2e_delay_seconds_count'
        values: '0+100x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: FleetwireFreshnessBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, slo: freshness}
            exp_annotations:
              summary: Readings are reaching storage too late; the 30-day freshness budget burns 14.4x too fast.
              runbook: docs/how-to/run-failure-tests.md

  # All readings on time: the SLI is 0 (not missing) and nothing fires.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}'
        values: '0+100x90'
      - series: 'fleetwire_ingest_e2e_delay_seconds_count'
        values: '0+100x90'
    promql_expr_test:
      - expr: fleetwire:freshness_errors:ratio_rate5m
        eval_time: 70m
        exp_samples:
          - labels: 'fleetwire:freshness_errors:ratio_rate5m'
            value: 0
    alert_rule_test:
      - eval_time: 70m
        alertname: FleetwireFreshnessBudgetBurnFast
        exp_alerts: []
      - eval_time: 70m
        alertname: FleetwireFreshnessBudgetBurnSlow
        exp_alerts: []

  # One batch in a thousand dead-lettered: 10x the 0.01% budget, above the
  # slow (6x) threshold but below the fast (14.4x) one, so only a ticket.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_batches_total{result="dlq"}'
        values: '0+1x400'
      - series: 'fleetwire_ingest_batches_total{result="stored"}'
        values: '0+999x400'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: FleetwireDeadLetterBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, slo: correctness}
            exp_annotations:
              summary: Batches are going to the dead-letter topic at a rate that will exhaust the budget.
      - eval_time: 6h10m
        alertname: FleetwireDeadLetterBudgetBurnFast
        exp_alerts: []

  # 10% of readings late for 6 h: above the slow (6%) threshold, below the
  # fast (14.4%) one.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}'
        values: '0+90x400'
      - series: 'fleetwire_ingest_e2e_delay_seconds_count'
        values: '0+100x400'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: FleetwireFreshnessBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, slo: freshness}
            exp_annotations:
              summary: Readings are reaching storage too late; the freshness budget burns 6x too fast.
      - eval_time: 6h10m
        alertname: FleetwireFreshnessBudgetBurnFast
        exp_alerts: []
  # One batch in a hundred dead-lettered: 100x the budget, so it pages.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_batches_total{result="dlq"}'
        values: '0+1x90'
      - series: 'fleetwire_ingest_batches_total{result="stored"}'
        values: '0+99x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: FleetwireDeadLetterBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, slo: correctness}
            exp_annotations:
              summary: Batches are going to the dead-letter topic; check its fw-dlq-reason headers.
  # 5% of API requests fail: above the fast threshold (1.44%).
  - interval: 1m
    input_series:
      - series: 'fleetwire_api_requests_total{listener="public",route="GET /v1/devices",code="500"}'
        values: '0+5x90'
      - series: 'fleetwire_api_requests_total{listener="public",route="GET /v1/devices",code="200"}'
        values: '0+95x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: FleetwireAPIBudgetBurnFast
        exp_alerts:
          - exp_labels: {severity: page, slo: availability}
            exp_annotations:
              summary: The API answers with 5xx; the availability budget burns 14.4x too fast.
  # 1% of API requests fail for 6 h: a ticket, not a page.
  - interval: 1m
    input_series:
      - series: 'fleetwire_api_requests_total{listener="public",route="GET /v1/devices",code="503"}'
        values: '0+1x400'
      - series: 'fleetwire_api_requests_total{listener="public",route="GET /v1/devices",code="200"}'
        values: '0+99x400'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: FleetwireAPIBudgetBurnSlow
        exp_alerts:
          - exp_labels: {severity: ticket, slo: availability}
            exp_annotations:
              summary: The API answers with 5xx at a rate that will exhaust the budget.
      - eval_time: 6h10m
        alertname: FleetwireAPIBudgetBurnFast
        exp_alerts: []
  # The CRL was last published 47 h 46 min ago and the API keeps failing:
  # the age passes 48 h at 14m and the alert fires 5 minutes later.
  - interval: 1m
    input_series:
      - series: 'fleetwire_crl_age_seconds{instance="api:9090"}'
        values: '172000+60x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: FleetwireCRLStale
        exp_alerts: []
      - eval_time: 18m
        alertname: FleetwireCRLStale
        exp_alerts: []
      - eval_time: 50m
        alertname: FleetwireCRLStale
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: No API replica has published the device CRL for 48 h; the broker will reject all devices when it expires.
  # Boot: until its first publish the API reports math.MaxInt64 ns (about
  # 9.2e9 s). Here the database is ready after 3 minutes. Neither CRL alert
  # fires (the old rule paged at once).
  - interval: 1m
    input_series:
      - series: 'fleetwire_crl_age_seconds{instance="api:9090",job="fleetwire-api"}'
        values: '9.223372036854776e9x3 0+60x30'
      - series: 'process_start_time_seconds{instance="api:9090",job="fleetwire-api"}'
        values: '0x34'
    alert_rule_test:
      - eval_time: 2m
        alertname: FleetwireCRLStale
        exp_alerts: []
      - eval_time: 30m
        alertname: FleetwireCRLStale
        exp_alerts: []
      - eval_time: 30m
        alertname: FleetwireCRLNotPublished
        exp_alerts: []
  # The API cannot publish after it starts. After 15 minutes that is a
  # ticket. It does not page: the CRL the previous process published may
  # still be fresh.
  - interval: 1m
    input_series:
      - series: 'fleetwire_crl_age_seconds{instance="api:9090",job="fleetwire-api"}'
        values: '9.223372036854776e9x40'
      - series: 'process_start_time_seconds{instance="api:9090",job="fleetwire-api"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: FleetwireCRLNotPublished
        exp_alerts: []
      - eval_time: 15m
        alertname: FleetwireCRLNotPublished
        exp_alerts:
          - exp_labels: {severity: ticket, instance: "api:9090", job: fleetwire-api}
            exp_annotations:
              summary: "api:9090 has not published the device CRL since it started; its log has the publisher's error."
      - eval_time: 40m
        alertname: FleetwireCRLStale
        exp_alerts: []
  # The API has run for 48 h without publishing once: the CRL is at least
  # that old, so it pages.
  - interval: 1m
    input_series:
      - series: 'fleetwire_crl_age_seconds{instance="api:9090",job="fleetwire-api"}'
        values: '9.223372036854776e9x2900'
      - series: 'process_start_time_seconds{instance="api:9090",job="fleetwire-api"}'
        values: '0x2900'
    alert_rule_test:
      - eval_time: 48h5m
        alertname: FleetwireCRLStale
        exp_alerts: []
      - eval_time: 48h6m
        alertname: FleetwireCRLStale
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: No API replica has published the device CRL for 48 h; the broker will reject all devices when it expires.
  # Two replicas. api-1 last published 49 h ago and keeps failing; api-2
  # has just restarted and not published yet. api-2's short uptime must not
  # hide api-1's old CRL.
  - interval: 1m
    input_series:
      - series: 'fleetwire_crl_age_seconds{instance="api-1:9090",job="fleetwire-api"}'
        values: '176400+60x20'
      - series: 'process_start_time_seconds{instance="api-1:9090",job="fleetwire-api"}'
        values: '-500000x20'
      - series: 'fleetwire_crl_age_seconds{instance="api-2:9090",job="fleetwire-api"}'
        values: '9.223372036854776e9x20'
      - series: 'process_start_time_seconds{instance="api-2:9090",job="fleetwire-api"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: FleetwireCRLStale
        exp_alerts: []
      - eval_time: 5m
        alertname: FleetwireCRLStale
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: No API replica has published the device CRL for 48 h; the broker will reject all devices when it expires.
  # Two replicas. api-1 publishes; api-2 started 49 h before the test
  # window (a negative start time) and has never published. The CRL is
  # fresh, so only api-2's ticket fires.
  - interval: 1m
    input_series:
      - series: 'fleetwire_crl_age_seconds{instance="api-1:9090",job="fleetwire-api"}'
        values: '0+60x30'
      - series: 'process_start_time_seconds{instance="api-1:9090",job="fleetwire-api"}'
        values: '0x30'
      - series: 'fleetwire_crl_age_seconds{instance="api-2:9090",job="fleetwire-api"}'
        values: '9.223372036854776e9x30'
      - series: 'process_start_time_seconds{instance="api-2:9090",job="fleetwire-api"}'
        values: '-176400x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: FleetwireCRLStale
        exp_alerts: []
      - eval_time: 30m
        alertname: FleetwireCRLNotPublished
        exp_alerts:
          - exp_labels: {severity: ticket, instance: "api-2:9090", job: fleetwire-api}
            exp_annotations:
              summary: "api-2:9090 has not published the device CRL since it started; its log has the publisher's error."
  # bridge-1 wedges at 10m with 1,000 messages waiting while bridge-2 keeps
  # producing. The alert names bridge-1: its last write is over 120 s old
  # from 13m, and 2 minutes later it fires. (The old rule took max() of the
  # timestamps across replicas, so bridge-2 hid it.)
  - interval: 1m
    input_series:
      - series: 'fleetwire_bridge_last_produce_timestamp_seconds{instance="bridge-1:9090",job="fleetwire-bridge"}'
        values: '0+60x10 600x30'
      - series: 'fleetwire_bridge_pending_acks{instance="bridge-1:9090",job="fleetwire-bridge"}'
        values: '0x10 1000x30'
      - series: 'fleetwire_bridge_last_produce_timestamp_seconds{instance="bridge-2:9090",job="fleetwire-bridge"}'
        values: '0+60x40'
      - series: 'fleetwire_bridge_pending_acks{instance="bridge-2:9090",job="fleetwire-bridge"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: FleetwireBridgeNotProducing
        exp_alerts: []
      - eval_time: 15m
        alertname: FleetwireBridgeNotProducing
        exp_alerts:
          - exp_labels: {severity: page, instance: "bridge-1:9090", job: fleetwire-bridge}
            exp_annotations:
              summary: "bridge-1:9090: messages wait for Kafka and no write has been confirmed for over 2 minutes."
  # Cold start: the bridge starts at 60m, and Kafka accepts its first write
  # only at 64m. The timestamp starts at the process start time, so the
  # write is over 120 s old just once (63m) and nothing fires. (With the
  # old 0 start value and no `for`, this paged at 60m.)
  - interval: 1m
    input_series:
      - series: 'fleetwire_bridge_last_produce_timestamp_seconds{instance="bridge-1:9090",job="fleetwire-bridge"}'
        values: '_x60 3600x3 3840+60x10'
      - series: 'fleetwire_bridge_pending_acks{instance="bridge-1:9090",job="fleetwire-bridge"}'
        values: '_x60 20x3 0x10'
    alert_rule_test:
      - eval_time: 63m
        alertname: FleetwireBridgeNotProducing
        exp_alerts: []
      - eval_time: 66m
        alertname: FleetwireBridgeNotProducing
        exp_alerts: []
  # Idle: no message between 5m and 30m, so the last write is 25 minutes
  # old when a message arrives; Kafka confirms it within the minute.
  - interval: 1m
    input_series:
      - series: 'fleetwire_bridge_last_produce_timestamp_seconds{instance="bridge-1:9090",job="fleetwire-bridge"}'
        values: '0+60x5 300x24 1860+60x10'
      - series: 'fleetwire_bridge_pending_acks{instance="bridge-1:9090",job="fleetwire-bridge"}'
        values: '0x29 40 0x10'
    alert_rule_test:
      - eval_time: 30m
        alertname: FleetwireBridgeNotProducing
        exp_alerts: []
      - eval_time: 33m
        alertname: FleetwireBridgeNotProducing
        exp_alerts: []
  # Lag over 1,000 and growing by 200 a minute: a ticket after 10 minutes.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_consumer_lag{instance="ingest-1:9090",partition="0"}'
        values: '500+100x40'
      - series: 'fleetwire_ingest_consumer_lag{instance="ingest-2:9090",partition="1"}'
        values: '500+100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: FleetwireConsumerLagGrowing
        exp_alerts: []
      - eval_time: 11m
        alertname: FleetwireConsumerLagGrowing
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: Ingest falls further behind Kafka; it is slower than the incoming rate.
  # A large lag that shrinks (ingest catching up after an outage) is fine.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_consumer_lag{instance="ingest-1:9090",partition="0"}'
        values: '20000-100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: FleetwireConsumerLagGrowing
        exp_alerts: []
  # bridge-1 stops answering scrapes at 6m: a ticket at 11m, no page, as
  # bridge-2 is up. The load generator is down, as it is between tests,
  # and does not alert.
  - interval: 1m
    input_series:
      - series: 'up{job="fleetwire-api",instance="api:9090"}'
        values: '1x20'
      - series: 'up{job="fleetwire-bridge",instance="bridge-1:9090"}'
        values: '1x5 0x15'
      - series: 'up{job="fleetwire-bridge",instance="bridge-2:9090"}'
        values: '1x20'
      - series: 'up{job="fleetwire-ingest",instance="ingest-1:9090"}'
        values: '1x20'
      - series: 'up{job="fleetwire-ingest",instance="ingest-2:9090"}'
        values: '1x20'
      - series: 'up{job="fleetwire-loadgen",instance="172.31.250.1:9466"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: FleetwireTargetDown
        exp_alerts: []
      - eval_time: 11m
        alertname: FleetwireTargetDown
        exp_alerts:
          - exp_labels: {severity: ticket, job: fleetwire-bridge, instance: "bridge-1:9090"}
            exp_annotations:
              summary: "Prometheus cannot scrape fleetwire-bridge at bridge-1:9090."
      - eval_time: 20m
        alertname: FleetwireServiceDown
        exp_alerts: []
  # Both ingest replicas go down at 6m, and Prometheus has no API target at
  # all. Each job pages 2 minutes after it is lost; each lost ingest target
  # also gets a ticket.
  - interval: 1m
    input_series:
      - series: 'up{job="fleetwire-bridge",instance="bridge-1:9090"}'
        values: '1x20'
      - series: 'up{job="fleetwire-ingest",instance="ingest-1:9090"}'
        values: '1x5 0x15'
      - series: 'up{job="fleetwire-ingest",instance="ingest-2:9090"}'
        values: '1x5 0x15'
    alert_rule_test:
      - eval_time: 7m
        alertname: FleetwireServiceDown
        exp_alerts:
          - exp_labels: {severity: page, job: fleetwire-api}
            exp_annotations:
              summary: "No fleetwire-api target is up or none is configured; the alerts that depend on its metrics cannot fire."
      - eval_time: 8m
        alertname: FleetwireServiceDown
        exp_alerts:
          - exp_labels: {severity: page, job: fleetwire-api}
            exp_annotations:
              summary: "No fleetwire-api target is up or none is configured; the alerts that depend on its metrics cannot fire."
          - exp_labels: {severity: page, job: fleetwire-ingest}
            exp_annotations:
              summary: "No fleetwire-ingest target is up or none is configured; the alerts that depend on its metrics cannot fire."
      - eval_time: 11m
        alertname: FleetwireTargetDown
        exp_alerts:
          - exp_labels: {severity: ticket, job: fleetwire-ingest, instance: "ingest-1:9090"}
            exp_annotations:
              summary: "Prometheus cannot scrape fleetwire-ingest at ingest-1:9090."
          - exp_labels: {severity: ticket, job: fleetwire-ingest, instance: "ingest-2:9090"}
            exp_annotations:
              summary: "Prometheus cannot scrape fleetwire-ingest at ingest-2:9090."

  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_exclusion_violations_total{instance="ingest-1:9090"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: FleetwireExclusionViolation
        exp_alerts: []
      - eval_time: 5m
        alertname: FleetwireExclusionViolation
        exp_alerts:
          # The alert keeps the instance, so the page names the ingest replica.
          - exp_labels: {severity: page, instance: "ingest-1:9090"}
            exp_annotations:
              summary: The database rejected an overlapping chunk. This is a bug signal; the batch went to the DLQ and the device will resend.

  # No batch was dead-lettered and no request failed: both ratios are 0.
  # Counters with no error series must not make the SLI disappear.
  - interval: 1m
    input_series:
      - series: 'fleetwire_ingest_batches_total{result="stored",instance="ingest-1:9090"}'
        values: '0+100x90'
      - series: 'fleetwire_api_requests_total{code="200",route="GET /v1/devices"}'
        values: '0+50x90'
    promql_expr_test:
      - expr: fleetwire:dlq_errors:ratio_rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'fleetwire:dlq_errors:ratio_rate5m'
            value: 0
      - expr: fleetwire:api_errors:ratio_rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'fleetwire:api_errors:ratio_rate5m'
            value: 0
