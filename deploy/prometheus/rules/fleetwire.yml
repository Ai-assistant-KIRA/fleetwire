# SLOs (docs/explanation/slos.md), 30-day objectives:
#   freshness    99%    of readings stored <= 5 s after collection
#   correctness  99.99% of batches not sent to the dead-letter topic
#   availability 99.9%  of API requests not answered with 5xx
# Alerts are multi-window burn-rate alerts: page when the 1 h and 5 m error
# ratios both burn the budget 14.4x faster than allowed (2% of a 30-day
# budget in one hour), ticket at 6x over 6 h and 30 m.
#
# Prometheus 3 stores histogram bucket bounds in float form, so the 5 s
# bucket is le="5.0", not le="5". Error counters may have no 5xx series at
# all, so their numerators fall back to 0 instead of making the ratio vanish.
groups:
  - name: fleetwire-sli
    rules:
      - record: fleetwire:freshness_errors:ratio_rate5m
        expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[5m])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[5m])))
      - record: fleetwire:freshness_errors:ratio_rate30m
        expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[30m])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[30m])))
      - record: fleetwire:freshness_errors:ratio_rate1h
        expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[1h])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[1h])))
      - record: fleetwire:freshness_errors:ratio_rate6h
        expr: 1 - (sum(rate(fleetwire_ingest_e2e_delay_seconds_bucket{le="5.0"}[6h])) / sum(rate(fleetwire_ingest_e2e_delay_seconds_count[6h])))

      - record: fleetwire:dlq_errors:ratio_rate5m
        expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[5m])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[5m]))
      - record: fleetwire:dlq_errors:ratio_rate30m
        expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[30m])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[30m]))
      - record: fleetwire:dlq_errors:ratio_rate1h
        expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[1h])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[1h]))
      - record: fleetwire:dlq_errors:ratio_rate6h
        expr: (sum(rate(fleetwire_ingest_batches_total{result="dlq"}[6h])) or vector(0)) / sum(rate(fleetwire_ingest_batches_total[6h]))

      - record: fleetwire:api_errors:ratio_rate5m
        expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[5m])) or vector(0)) / sum(rate(fleetwire_api_requests_total[5m]))
      - record: fleetwire:api_errors:ratio_rate30m
        expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[30m])) or vector(0)) / sum(rate(fleetwire_api_requests_total[30m]))
      - record: fleetwire:api_errors:ratio_rate1h
        expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[1h])) or vector(0)) / sum(rate(fleetwire_api_requests_total[1h]))
      - record: fleetwire:api_errors:ratio_rate6h
        expr: (sum(rate(fleetwire_api_requests_total{code=~"5.."}[6h])) or vector(0)) / sum(rate(fleetwire_api_requests_total[6h]))

  - name: fleetwire-slo-alerts
    rules:
      - alert: FleetwireFreshnessBudgetBurnFast
        expr: fleetwire:freshness_errors:ratio_rate1h > (14.4 * 0.01) and fleetwire:freshness_errors:ratio_rate5m > (14.4 * 0.01)
        labels: {severity: page, slo: freshness}
        annotations:
          summary: Readings are reaching storage too late; the 30-day freshness budget burns 14.4x too fast.
          runbook: docs/how-to/run-failure-tests.md
      - alert: FleetwireFreshnessBudgetBurnSlow
        expr: fleetwire:freshness_errors:ratio_rate6h > (6 * 0.01) and fleetwire:freshness_errors:ratio_rate30m > (6 * 0.01)
        labels: {severity: ticket, slo: freshness}
        annotations:
          summary: Readings are reaching storage too late; the freshness budget burns 6x too fast.
      - alert: FleetwireDeadLetterBudgetBurnFast
        expr: fleetwire:dlq_errors:ratio_rate1h > (14.4 * 0.0001) and fleetwire:dlq_errors:ratio_rate5m > (14.4 * 0.0001)
        labels: {severity: page, slo: correctness}
        annotations:
          summary: Batches are going to the dead-letter topic; check its fw-dlq-reason headers.
      - alert: FleetwireDeadLetterBudgetBurnSlow
        expr: fleetwire:dlq_errors:ratio_rate6h > (6 * 0.0001) and fleetwire:dlq_errors:ratio_rate30m > (6 * 0.0001)
        labels: {severity: ticket, slo: correctness}
        annotations:
          summary: Batches are going to the dead-letter topic at a rate that will exhaust the budget.
      - alert: FleetwireAPIBudgetBurnFast
        expr: fleetwire:api_errors:ratio_rate1h > (14.4 * 0.001) and fleetwire:api_errors:ratio_rate5m > (14.4 * 0.001)
        labels: {severity: page, slo: availability}
        annotations:
          summary: The API answers with 5xx; the availability budget burns 14.4x too fast.
      - alert: FleetwireAPIBudgetBurnSlow
        expr: fleetwire:api_errors:ratio_rate6h > (6 * 0.001) and fleetwire:api_errors:ratio_rate30m > (6 * 0.001)
        labels: {severity: ticket, slo: availability}
        annotations:
          summary: The API answers with 5xx at a rate that will exhaust the budget.

  - name: fleetwire-symptoms
    rules:
      # fleetwire_crl_age_seconds is the time since this API process last
      # published the CRL. Until its first publish it reports about 9.2e9 s
      # (math.MaxInt64 ns), so a value of 1e9 s (31 years) or more means
      # "not published since it started", not a real age.
      - alert: FleetwireCRLStale
        # OpenSSL rejects every device once nextUpdate (7 days) passes.
        # Either the freshest replica that has published did so over 48 h
        # ago, or no replica has published since it started and every one
        # has been up for over 48 h. A replica that has just started counts
        # only through its uptime, so a restart neither pages (the boot
        # value) nor hides an old CRL that another replica failed to renew.
        expr: >-
          min(fleetwire_crl_age_seconds < 1e9) > 48 * 3600
          or
          (
            min((time() - process_start_time_seconds) and (fleetwire_crl_age_seconds >= 1e9)) > 48 * 3600
            unless on () (fleetwire_crl_age_seconds < 1e9)
          )
        for: 5m
        labels: {severity: page}
        annotations:
          summary: No API replica has published the device CRL for 48 h; the broker will reject all devices when it expires.
      - alert: FleetwireCRLNotPublished
        # The publisher tries at start and then every minute; a quarter of
        # an hour without success is a broken database, CA key or CRL path.
        expr: fleetwire_crl_age_seconds >= 1e9
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.instance }} has not published the device CRL since it started; its log has the publisher's error."
      - alert: FleetwireBridgeNotProducing
        # Per replica: a replica wedged with messages waiting is not hidden
        # by another one that still produces. The timestamp starts at the
        # process start time, and the `for` lets an idle replica's first
        # messages after a quiet spell reach Kafka before anything fires.
        expr: (time() - fleetwire_bridge_last_produce_timestamp_seconds) > 120 and fleetwire_bridge_pending_acks > 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }}: messages wait for Kafka and no write has been confirmed for over 2 minutes."
      - alert: FleetwireConsumerLagGrowing
        expr: sum(fleetwire_ingest_consumer_lag) > 1000 and deriv(sum(fleetwire_ingest_consumer_lag)[10m:1m]) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Ingest falls further behind Kafka; it is slower than the incoming rate.
      - alert: FleetwireExclusionViolation
        # Must never happen: the coverage logic tried to store a seq twice.
        expr: increase(fleetwire_ingest_exclusion_violations_total[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: The database rejected an overlapping chunk. This is a bug signal; the batch went to the DLQ and the device will resend.
  # Without these, a stopped service makes the SLO and symptom alerts above
  # go quiet instead of firing: their series stop or disappear. Job names
  # are those in deploy/prometheus/prometheus.yml. fleetwire-loadgen is left
  # out: it runs only during tests.
  - name: fleetwire-liveness
    rules:
      - alert: FleetwireTargetDown
        # One replica; the others carry its work.
        expr: up{job=~"fleetwire-(api|bridge|ingest)"} == 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."
      - alert: FleetwireServiceDown
        # Every target of a job is down, or Prometheus has none at all (a
        # discovery or configuration change dropped them).
        expr: >-
          sum by (job) (up{job=~"fleetwire-(api|bridge|ingest)"}) == 0
          or absent(up{job="fleetwire-api"})
          or absent(up{job="fleetwire-bridge"})
          or absent(up{job="fleetwire-ingest"})
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "No {{ $labels.job }} target is up or none is configured; the alerts that depend on its metrics cannot fire."
