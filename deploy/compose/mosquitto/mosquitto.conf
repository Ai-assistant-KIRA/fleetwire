# Mosquitto for the fleetwire development stack.
#
# Two listeners, because OpenSSL checks only the CRL of the leaf's issuer
# (see docs/reference/third-party-facts.md):
#   8883  devices: device CA chain, CRL checked, reached through Toxiproxy
#   8884  services: service CA chain, internal network only
# Usernames are certificate CNs; the ACL pins every device to its own topics.

per_listener_settings false
allow_anonymous false
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 10

# Queues for offline persistent sessions (a stopped bridge's share of a
# shared subscription waits here, see task 0.2).
max_queued_messages 1000000
max_queued_bytes 268435456
max_inflight_messages 1000
# 256 KiB payload limit (design 5.2) plus room for the topic and properties.
max_packet_size 270000
max_keepalive 300
set_tcp_nodelay true

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

listener 8883
protocol mqtt
max_connections -1
cafile /secrets/device-trust.pem
certfile /secrets/mosquitto.pem
keyfile /secrets/mosquitto.key
crlfile /crl/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

listener 8884
protocol mqtt
cafile /secrets/service-trust.pem
certfile /secrets/mosquitto.pem
keyfile /secrets/mosquitto.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
