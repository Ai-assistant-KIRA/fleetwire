# Mosquitto for the fleetwire development stack.
#
# Two listeners, because OpenSSL checks only the CRL of the leaf's issuer
# (see docs/reference/third-party-facts.md):
#   8883  devices: device CA chain, CRL checked, reached through Toxiproxy
#   8884  services: service CA chain, internal network only
# Usernames are certificate CNs. Each listener has its own ACL, so a
# certificate from the online device CA that carries a service CN gets only
# device rights on 8883, and a device certificate gets no rights on 8884.
#
# per_listener_settings is what makes acl_file apply to one listener.
# Mosquitto 2.1 deprecates it (removal planned for 3.0) but has no other way
# to give a listener its own ACL; it must come before the other security
# settings.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
autosave_interval 10
# Queues for offline persistent sessions (a stopped bridge's share of a
# shared subscription waits here; see docs/reference/third-party-facts.md).
max_queued_messages 1000000
max_queued_bytes 268435456
max_inflight_messages 1000
# The 256 KiB uplink payload limit (uplinkpb.MaxMessageBytes) plus room for
# the topic and properties.
max_packet_size 270000
max_keepalive 300
set_tcp_nodelay true
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

listener 8883
protocol mqtt
max_connections -1
listener_allow_anonymous false
acl_file /mosquitto/config/acl-devices
cafile /run/secrets/device-trust.pem
certfile /run/secrets/mosquitto.pem
keyfile /run/secrets/mosquitto.key
crlfile /crl/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

listener 8884
protocol mqtt
listener_allow_anonymous false
acl_file /mosquitto/config/acl-services
cafile /run/secrets/service-trust.pem
certfile /run/secrets/mosquitto.pem
keyfile /run/secrets/mosquitto.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
