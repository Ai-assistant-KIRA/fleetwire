name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag's amd64 and arm64 snaps, built by snapcraft on native runners.
  snap:
    uses: ./.github/workflows/snap.yml

  release:
    needs: [snap]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # create the release
      packages: write   # push images to GHCR
      id-token: write   # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Exact tool versions: a release job with write and OIDC permissions
      # must not pick up whatever version was published last.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snap-*
          merge-multiple: true
          path: ${{ runner.temp }}/snaps
      - name: Check the snaps and write their SBOMs
        env:
          SNAP_DIR: ${{ runner.temp }}/snaps
        run: |
          set -euo pipefail
          # Exactly the tag's two snaps: a snap whose version is not the tag
          # (another tag on the commit, a dirty tree) is not published.
          shopt -s nullglob
          files=("$SNAP_DIR"/*)
          found=$(printf '%s\n' "${files[@]##*/}" | sort | paste -sd' ')
          expected="fleetwire-agent_${GITHUB_REF_NAME}_amd64.snap fleetwire-agent_${GITHUB_REF_NAME}_arm64.snap"
          test "$found" = "$expected" || { echo "expected: $expected; found: $found"; exit 1; }
          command -v unsquashfs >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools; }
          # SPDX JSON, as GoReleaser writes for the archives. Syft reads the
          # Go module list from the packaged agent binary.
          mkdir -p "$RUNNER_TEMP/unpacked"
          for snap in "${files[@]}"; do
            root="$RUNNER_TEMP/unpacked/$(basename "$snap" .snap)"
            unsquashfs -no-progress -d "$root" "$snap" >/dev/null
            syft scan "dir:$root" --source-name fleetwire-agent --source-version "$GITHUB_REF_NAME" \
              -o "spdx-json=$snap.sbom.json"
          done
          # .goreleaser.yaml adds this directory to checksums.txt and the release.
          echo "FLEETWIRE_SNAP_DIR=$SNAP_DIR" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
