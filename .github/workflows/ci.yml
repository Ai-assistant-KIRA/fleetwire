name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the whole suite on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes its older run. Every other run
# (main, a tag release calling this workflow) gets a group of its own: one
# shared group would cancel a pending main run when the next commit lands,
# leaving that commit untested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' ':!:internal/gen/' | xargs -0 gofmt -s -l)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Unit and integration tests (race detector; PostgreSQL via testcontainers)
        run: go test -race -count=1 -timeout 20m ./...
      - name: Fuzz smoke (30 s per target)
        run: ./scripts/fuzz-smoke.sh 30s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          make check-generated
      - name: Configuration reference is up to date
        run: |
          make docs-reference
          git diff --exit-code -- docs/reference/configuration.md || { echo "configuration reference is stale: run make docs-reference"; exit 1; }

  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
          push: false
          # Commenting needs pull-requests: write; the results are in the job.
          pr_comment: false

  charms:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        # ".": charms/tox.ini, the bundle's integration test. It needs Juju
        # to run, but its lint runs anywhere.
        charm: [fleetwire-api-k8s, fleetwire-ingest-k8s, fleetwire-bridge-k8s, mosquitto-k8s, .]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install tox==4.32.0
      - run: tox -c charms/${{ matrix.charm }} -e ${{ matrix.charm == '.' && 'lint' || 'lint,unit' }}

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool
        env:
          PROM_VERSION: "3.16.0"
          PROM_SHA256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
        run: |
          tarball="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${tarball}"
          echo "${PROM_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"
          sudo install "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/
          make rules-test

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's apt shellcheck lags behind; a pinned release gives the
      # same findings as a local run.
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$tarball" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          make shellcheck

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make docs
      - name: Link check
        run: .cache/docs-venv/bin/sphinx-build -b linkcheck docs docs/_build/linkcheck

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        binary: [fleetwire-api, fleetwire-bridge, fleetwire-ingest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --load --build-arg BINARY=${{ matrix.binary }} --build-arg VERSION=${{ github.sha }} -t ${{ matrix.binary }}:ci .
      # Grype checks the image's packages and the Go binary's modules and
      # standard library against known vulnerabilities. A high or critical
      # one that already has a fix fails the job; the table is in the log.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.binary }}:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # Every archive, SBOM and per-platform release image (deploy/release/
  # Dockerfile), built as the tag release builds them but neither signed nor
  # published, so a broken .goreleaser.yaml or release Dockerfile fails here
  # instead of on a tag. Tools and versions match release.yml.
  release-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --snapshot --clean --skip=sign
