name: snap
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["snap/**", "cmd/fleetwire-agent/**", "internal/**", "go.mod"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snap
      - name: Check packaged binary version
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snap }}
        run: |
          set -euo pipefail
          snap_version=$(unsquashfs -cat "$SNAP_FILE" meta/snap.yaml | awk '$1 == "version:" { print $2; exit }')
          test -n "$snap_version"
          unsquashfs -cat "$SNAP_FILE" bin/fleetwire-agent > "$RUNNER_TEMP/fleetwire-agent"
          chmod +x "$RUNNER_TEMP/fleetwire-agent"
          binary_output=$("$RUNNER_TEMP/fleetwire-agent" version)
          binary_version=${binary_output%% *}
          test -n "$binary_version"
          test "$binary_version" = "$snap_version" || {
            echo "snap version $snap_version does not match binary version $binary_version"
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-${{ matrix.runner }}
          path: ${{ steps.snap.outputs.snap }}
