name: e2e
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  # release.yml runs it on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    # On a pull request: when the e2e label is added, and on every push while
    # it is there. Adding some other label does not start a run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    # Job-level, so a run whose job is skipped never cancels one that runs.
    # Only a newer run for the same pull request cancels; main gets a group
    # per run.
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Start the stack
        run: make build up
      - name: End-to-end test
        run: FLEETWIRE_E2E=1 go test -count=1 -timeout 15m ./test/e2e/...
      - name: Two short failure scenarios
        run: bin/fleetwire-chaos run -scenario network-cut,ingest-kill -devices 200 -steady 30s -after 30s -out ci-results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: ci-results
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --tail 200
