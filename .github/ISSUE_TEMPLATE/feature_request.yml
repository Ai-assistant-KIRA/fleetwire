name: Feature request
description: Propose a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do that fleetwire does not allow today?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, and how it affects the delivery guarantee or tenant isolation, if at all.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
